services:
  # ---------------------------------------------------------------------------
  # Valkey (Drop-in replacement for Redis - Open Source BSD-3)
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9-alpine
    container_name: aml-valkey
    command: valkey-server --requirepass secretpass
    ports:
      - "6379:6379"
    networks:
      - aml-net
    healthcheck:
      test: [ "CMD", "valkey-cli", "-a", "secretpass", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL (Primary DB for Outbox & States)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: aml-postgres
    environment:
      POSTGRES_DB: aml_db
      POSTGRES_USER: aml_user
      POSTGRES_PASSWORD: aml_password
    command: postgres -c wal_level=logical -c max_wal_senders=4 -c max_replication_slots=4
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - aml-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aml_user -d aml_db" ]
      interval: 5s
      timeout: 3s
      retries: 5

  debezium:
    image: quay.io/debezium/connect:3.7
    container_name: aml-debezium
    ports:
      - "8083:8083"
    networks:
      - aml-net
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Debezium Connector Automatic Initializer
  # ---------------------------------------------------------------------------
  debezium-init:
    image: curlimages/curl:8.21.0
    container_name: aml-debezium-init
    depends_on:
      - debezium
    networks:
      - aml-net
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for Kafka Connect to start..."
        while [ $(curl -s -o /dev/null -w "%{http_code}" http://debezium:8083/connectors) -ne 200 ]; do
          sleep 2
        done
        echo "Kafka Connect is up! Registering Outbox connector..."
        curl -i -X POST http://debezium:8083/connectors/ \
          -H "Content-Type: application/json" \
          -d '{
            "name": "aml-outbox-connector",
            "config": {
              "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
              "tasks.max": "1",
              "database.hostname": "postgres",
              "database.port": "5432",
              "database.user": "aml_user",
              "database.password": "aml_password",
              "database.dbname": "aml_db",
              "topic.prefix": "aml",
              "table.include.list": "public.outbox_events",
              "plugin.name": "pgoutput",

              "transforms": "outbox",
              "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",

              "transforms.outbox.table.field.event.id": "id",
              "transforms.outbox.table.field.event.key": "aggregate_id",
              "transforms.outbox.table.field.event.payload": "payload",

              "transforms.outbox.route.by.field": "aggregate_type",
              "transforms.outbox.route.topic.replacement": "aml.$${routedByValue}-evaluated.v1"
            }
          }'
        echo "\nConnector registration completed!"

  # ---------------------------------------------------------------------------
  # Apache Cassandra (NoSQL for Transaction History / Audit Log)
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:6.0
    container_name: aml-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=AMLCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - aml-net
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1" ]
      start_period: 45s
      interval: 10s
      timeout: 10s
      retries: 10

  cassandra-init:
    image: cassandra:6.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        echo "Searching for CQL scripts..."
        for f in /opt/init-scripts/*.cql; do
          if [ -f "$$f" ]; then
            echo "Executing $$f..."
            cqlsh aml-cassandra -f "$$f"
          fi
        done
        echo "Initialization finished."
    volumes:
      - ./src/main/resources/cassandra/init-scripts:/opt/init-scripts:ro
    networks:
      - aml-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft Mode - No Zookeeper needed)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: aml-kafka
    ports:
      - "9092:9092"
    networks:
      - aml-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka UI for visual monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: aml-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # LocalStack (AWS S3 Emulator for Sanction Lists)
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:s3-community-archive
    container_name: aml-localstack
    ports:
      - "4566:4566"
    networks:
      - aml-net
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=eu-central-1
    volumes:
      - ./infra/s3/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

  kafka-connect-s3:
    image: confluentinc/cp-kafka-connect:8.0.7
    container_name: aml-kafka-connect-s3
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_started
    ports:
      - "8084:8083"
    networks:
      - aml-net
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "connect-s3-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-s3-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-s3-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-s3-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect-s3"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    command:
      - bash
      - -c
      - |
        echo "Installing Confluent S3 Sink Connector..."
        confluent-hub install --no-prompt confluentinc/kafka-connect-s3:12.1.0
        echo "Starting Kafka Connect worker..."
        /etc/confluent/docker/run

  kafka-connect-s3-init:
    image: curlimages/curl:8.21.0
    container_name: aml-kafka-connect-s3-init
    depends_on:
      - kafka-connect-s3
    networks:
      - aml-net
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for Kafka Connect S3 REST API..."
        while [ $$(curl -s -o /dev/null -w "%{http_code}" http://kafka-connect-s3:8083/connectors) -ne 200 ]; do
          sleep 3
        done
        echo "Kafka Connect is UP. Registering S3 Sink Connector..."
        curl -X POST http://kafka-connect-s3:8083/connectors \
          -H "Content-Type: application/json" \
          -d '{
            "name": "s3-sink-aml-audit",
            "config": {
              "connector.class": "io.confluent.connect.s3.S3SinkConnector",
              "tasks.max": "1",
              "topics": "aml.transaction-evaluated.v1",
              "s3.region": "eu-central-1",
              "s3.bucket.name": "aml-audit-logs",
              "s3.part.size": "5242880",
              "flush.size": "1000",
              "rotate.interval.ms": "10000",
              "store.url": "http://localstack:4566",
              "s3.wan.of.path.style": "true",
              "storage.class": "io.confluent.connect.s3.storage.S3Storage",
              "format.class": "io.confluent.connect.s3.format.json.JsonFormat",
              "schema.compatibility": "NONE"
            }
          }'
        echo "S3 Sink Connector registered successfully!"

  # ---------------------------------------------------------------------------
  # Prometheus & Grafana (Observability & SLA Tracking)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3
    container_name: aml-prometheus
    ports:
      - "9090:9090"
    networks:
      - aml-net
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.2-slim
    container_name: aml-grafana
    ports:
      - "3000:3000"
    networks:
      - aml-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  cassandra_data:

networks:
  aml-net:
    driver: bridge
