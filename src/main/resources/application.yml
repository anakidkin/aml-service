server:
  port: 8080

spring:
  application:
    name: aml-service
#  threads:
#    virtual:
#      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aml_db}
    username: ${DB_USER:aml_user}
    password: ${DB_PASSWORD:aml_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: aml-core-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  cassandra:
    contact-points:
      - ${CASSANDRA_HOST:localhost}:${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
#    keyspace-name: aml_ks
    schema-action: NONE
#    contact-points: ${CASSANDRA_HOST:localhost}:${CASSANDRA_PORT:9042}

# --- Application Custom Properties ---
aml:
  kafka:
    topics:
      inbound-transactions: ${AML_KAFKA_TOPIC_INBOUND:aml.transactions-inbound.v1}
      transaction-evaluated: ${AML_KAFKA_TOPIC_EVALUATED:aml.transaction-evaluated.v1}
    groups:
      core-processor: ${AML_KAFKA_GROUP_CORE:aml-core-processor-group}
      history-writer: ${AML_KAFKA_GROUP_HISTORY:aml-history-writer-group}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: aml-service

logging:
  level:
    root: INFO
    io.github.anakidkin: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN